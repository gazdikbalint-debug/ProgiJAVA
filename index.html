<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Osztályfőnök Fan Club</title>
<style>
*{box-sizing: border-box;}
body{
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(#383838, #000);
  padding: 20px;
}

.container{
  width: 90%;
  max-width: 800px;
}

h1{
  color: #ff3030;
  font-size: 36px;
  text-shadow: 0 0 15px red;
}

#countdown{
  font-size: 100px;
  font-weight: bold;
  color: #ff3030;
  margin: 20px 0;
}

button{
  padding: 18px 30px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  background: #e00000;
  border: 2px solid white;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 25px;
}

button:hover{
  background: white;
  color: #e00000;
}

.spotify-container{
  margin-top: 20px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
}
</style>
</head>
<body>

<div class="container">
    <h1>Üdvözöllek a belépő oldalon!</h1>
    <p>A főnöknek speciálba!</p>

    <div id="countdown">10</div>

    <button id="belepes">
        !!!BELÉPÉS A TANÁR ÚRRÓL SZÓLÓ OLDALRA!!!
    </button>

    <div class="spotify-container">
        <iframe 
            style="border-radius:12px" 
            src="https://open.spotify.com/embed/playlist/6Lgg0qnj1r8j4aQIpPKFLf?utm_source=generator&theme=0" 
            width="100%" 
            height="152" 
            frameBorder="0" 
            allowfullscreen="" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
            loading="lazy">
        </iframe>
    </div>
</div>

<script>
let ido = 10;
const szamlalo = document.getElementById("countdown");
const gomb = document.getElementById("belepes");

let visszaszamlalas = setInterval(function () {
    ido--;
    if (ido <= 0) {
        ido = 0;
        szamlalo.textContent = "GO!";
        clearInterval(visszaszamlalas);
    } else {
        szamlalo.textContent = ido;
    }
}, 1000);

gomb.onclick = function () {
    window.location.href = "kecske.html";
};
</script>

</body>
</html>
